# LLaMA-Factory LoRA-SFT template for WEASEL-selected data.
# scripts/run_train.sh renders @PLACEHOLDERS@ -> a concrete yaml per model and
# launches `llamafactory-cli train`. Do not run this file directly.
#
# Paper recipe (Table 9): LoRA rank 8 / alpha 8 / cosine LR / bf16 / AdamW,
#   Qwen2.5-7B-Instruct  lr 2e-5  epochs 4  global-batch 8
#   Gemma3-4B-IT         lr 2e-5  epochs 2  global-batch 16
#   Qwen3-8B             lr 1e-6  epochs 2  global-batch 8

### model
model_name_or_path: @MODEL_PATH@
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 8            # paper value; LLaMA-Factory would otherwise default to 2*rank=16
lora_dropout: 0.0
lora_target: all

### dataset
dataset: @DATASET@
dataset_dir: @DATASET_DIR@
template: @TEMPLATE@      # qwen | qwen3 | gemma3
cutoff_len: @CUTOFF@      # web AXTree prompts are long; raise if you see truncation
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: @OUTPUT_DIR@
logging_steps: 10
save_strategy: epoch
save_only_model: true
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: @PER_DEVICE@
gradient_accumulation_steps: @GRAD_ACCUM@
learning_rate: @LR@
num_train_epochs: @EPOCHS@
lr_scheduler_type: cosine
warmup_ratio: 0.1
optim: adamw_torch
bf16: true
ddp_timeout: 180000000
@DS_LINE@
