# Experiment 2 — WEASEL-selected SUBSET, LoRA SFT, paper-faithful (Qwen3-8B recipe).
# Same recipe as exp1_full; ONLY `dataset` differs (WEASEL subset built by
# scripts/run_select.sh). scripts/run_experiment.sh --exp weasel renders + runs this.

### model
model_name_or_path: @MODEL_PATH@      # MODEL_QWEN35_9B (group-volume checkpoint)
trust_remote_code: true

### method (LoRA r8 / alpha8 — identical to exp1)
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 8
lora_dropout: 0.0
lora_target: all

### dataset (the ONLY difference from exp1: WEASEL-selected subset)
dataset: newdata_weasel
dataset_dir: @DATASET_DIR@
template: @TEMPLATE@
cutoff_len: @CUTOFF@
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: @OUTPUT_DIR@
logging_steps: 10
save_strategy: epoch
save_only_model: true
plot_loss: true
overwrite_output_dir: true
report_to: none

### train (identical hyperparameters to exp1)
per_device_train_batch_size: @PER_DEVICE@
gradient_accumulation_steps: @GRAD_ACCUM@
learning_rate: 1.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
optim: adamw_torch
bf16: true
ddp_timeout: 180000000
@DS_LINE@
