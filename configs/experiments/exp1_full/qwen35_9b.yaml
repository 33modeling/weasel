# Experiment 1 — FULL data, LoRA SFT, paper-faithful (Qwen3-8B recipe from Table 9).
# Identical recipe to exp2_weasel; ONLY `dataset` differs (full vs WEASEL subset),
# exactly like the paper's "+Full" vs "+Weasel" comparison.
# scripts/run_experiment.sh --exp full renders the @PLACEHOLDERS@ and launches training.

### model
model_name_or_path: @MODEL_PATH@      # MODEL_QWEN35_9B (group-volume checkpoint)
trust_remote_code: true

### method (LoRA — paper uses LoRA for ALL runs; "+Full" = full DATA, not full-FT)
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 8
lora_dropout: 0.0
lora_target: all

### dataset
dataset: newdata_full
dataset_dir: @DATASET_DIR@
template: @TEMPLATE@                   # QWEN35_9B_TEMPLATE (default qwen3 — confirm for your model)
cutoff_len: @CUTOFF@
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: @OUTPUT_DIR@
logging_steps: 10
save_strategy: epoch
save_only_model: true
plot_loss: true
overwrite_output_dir: true
report_to: none

### train (paper Qwen3-8B row: lr 1e-6, 2 epochs, global batch 8, bf16, cosine)
per_device_train_batch_size: @PER_DEVICE@
gradient_accumulation_steps: @GRAD_ACCUM@
learning_rate: 1.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
optim: adamw_torch
bf16: true
ddp_timeout: 180000000
@DS_LINE@
